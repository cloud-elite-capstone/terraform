name: Deploy LikeC4 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/likec4/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-likec4.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build LikeC4 (prod)
        working-directory: docs/likec4
        run: npx likec4 build --base /terraform -o ../../dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
